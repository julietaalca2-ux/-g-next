
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0, viewport-fit=cover">

    <meta name="theme-color" content="#ffffff">

    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">

    <title>ÖG</title>

    <link rel="manifest" href="./manifest.json">

    <!-- CSS ORIGINAL DE ÖG -->
    <link rel="stylesheet" href="./css/variables.css">
    <link rel="stylesheet" href="./css/reset.css">
    <link rel="stylesheet" href="./css/global.css">
    <link rel="stylesheet" href="./css/layout.css">
    <link rel="stylesheet" href="./css/header.css">
    <link rel="stylesheet" href="./css/navigation.css">
    <link rel="stylesheet" href="./css/feed.css">
    <link rel="stylesheet" href="./css/stories.css">
    <link rel="stylesheet" href="./css/profile.css">
    <link rel="stylesheet" href="./css/explore.css">
    <link rel="stylesheet" href="./css/chat.css">
    <link rel="stylesheet" href="./css/activity.css">
    <link rel="stylesheet" href="./css/modals.css">
    <link rel="stylesheet" href="./css/animations.css">

    <!-- ÖG RESPONSIVE LAYOUT FIX -->
    <style>
        :root {
            --og-header-height: 56px;
            --og-navigation-height: 64px;
        }

        *,
        *::before,
        *::after {
            box-sizing: border-box;
        }

        html {
            width: 100%;
            min-height: 100%;
            margin: 0;
            padding: 0;
            overflow-x: hidden;
            -webkit-text-size-adjust: 100%;
        }

        body {
            width: 100%;
            min-width: 0;
            min-height: 100vh;
            min-height: 100dvh;
            margin: 0 !important;
            padding: 0 !important;
            overflow-x: hidden;
            background: #ffffff;
        }

        #app {
            position: relative;
            width: 100%;
            min-width: 0;
            min-height: 100vh;
            min-height: 100dvh;
            margin: 0;
            padding: 0;
            overflow-x: clip;
        }

        /* HEADER SUPERIOR */

        header.ig-header {
            position: fixed !important;
            top: 0 !important;
            left: 0 !important;
            right: 0 !important;

            width: 100% !important;
            max-width: none !important;

            height: calc(
                var(--og-header-height) + env(safe-area-inset-top, 0px)
            ) !important;

            margin: 0 !important;
            padding:
                env(safe-area-inset-top, 0px)
                16px
                0 !important;

            display: flex !important;
            flex-direction: row !important;
            flex-wrap: nowrap !important;
            align-items: center !important;
            justify-content: space-between !important;

            background: #ffffff;
            border-bottom: 1px solid #efefef;

            z-index: 9000;
        }

        .ig-logo-container {
            display: flex !important;
            flex: 0 1 auto !important;
            flex-direction: row !important;
            align-items: center !important;
            justify-content: flex-start !important;

            width: auto !important;
            min-width: 0;
            margin: 0 !important;
        }

        .ig-logo-text {
            display: block;
            margin: 0 !important;
            padding: 0 !important;

            font-size: 32px;
            font-weight: 900;
            line-height: 1;
            letter-spacing: -1.5px;
            color: #000000;
        }

        .ig-header-actions {
            display: flex !important;
            flex: 0 0 auto !important;
            flex-direction: row !important;
            flex-wrap: nowrap !important;
            align-items: center !important;
            justify-content: flex-end !important;

            width: auto !important;
            gap: 14px;
            margin-left: auto !important;
        }

        .ig-icon-btn {
            display: flex !important;
            flex: 0 0 40px !important;

            width: 40px !important;
            height: 40px !important;

            align-items: center !important;
            justify-content: center !important;

            margin: 0 !important;
            padding: 0 !important;

            background: transparent;
            border: 0;
        }

        .ig-icon {
            display: block;
            width: 26px;
            height: 26px;
            flex-shrink: 0;
        }

        /* CONTENIDO PRINCIPAL */

        main#mainContent {
            position: relative !important;

            display: block;

            width: 100% !important;
            max-width: 470px;
            min-width: 0;

            min-height: 100vh;
            min-height: 100dvh;

            margin: 0 auto !important;

            padding-top: calc(
                var(--og-header-height) + env(safe-area-inset-top, 0px)
            ) !important;

            padding-bottom: calc(
                var(--og-navigation-height) + env(safe-area-inset-bottom, 0px)
            ) !important;

            box-sizing: border-box;
        }

        .page-view {
            position: relative;
            width: 100%;
            max-width: 100%;
            min-width: 0;
            margin: 0;
        }

        .page-view.active {
            display: block;
        }

        /* NAVEGACION INFERIOR */

        nav.bottom-nav {
            position: fixed !important;

            left: 0 !important;
            right: 0 !important;
            bottom: 0 !important;

            width: 100% !important;
            max-width: none !important;

            height: calc(
                var(--og-navigation-height) + env(safe-area-inset-bottom, 0px)
            ) !important;

            margin: 0 !important;
            padding:
                0
                4px
                env(safe-area-inset-bottom, 0px) !important;

            display: flex !important;
            flex-direction: row !important;
            flex-wrap: nowrap !important;

            align-items: center !important;
            justify-content: space-around !important;

            background: rgba(255, 255, 255, 0.98);
            border-top: 1px solid #efefef;

            z-index: 10000;
        }

        .bottom-nav .bottom-nav-item {
            position: relative;

            display: flex !important;
            flex: 1 1 20% !important;

            width: 20% !important;
            min-width: 0 !important;
            height: 100% !important;

            margin: 0 !important;
            padding: 0 !important;

            align-items: center !important;
            justify-content: center !important;

            background: transparent;
            border: 0;
        }

        .bottom-nav .nav-svg-icon {
            display: block;

            width: 26px !important;
            height: 26px !important;

            max-width: 26px;
            flex-shrink: 0;
        }

        /* TABLETS Y ESCRITORIO */

        @media (min-width: 481px) {
            main#mainContent {
                max-width: 470px;
                margin-left: auto !important;
                margin-right: auto !important;
            }
        }

        /* TELEFONOS */

        @media (max-width: 480px) {
            header.ig-header {
                padding-left: 16px !important;
                padding-right: 16px !important;
            }

            main#mainContent {
                width: 100% !important;
                max-width: 100% !important;
            }

            nav.bottom-nav {
                width: 100% !important;
            }
        }
    </style>
</head>

<body>

    <div id="app">

        <!-- HEADER -->
        <header class="ig-header">

            <div class="ig-logo-container">
                <h1 class="ig-logo-text">ÖG</h1>
            </div>

            <div class="ig-header-actions">

                <button class="ig-icon-btn"
                        aria-label="Notificaciones">

                    <svg class="ig-icon"
                         viewBox="0 0 24 24"
                         fill="none"
                         xmlns="http://www.w3.org/2000/svg">

                        <path
                            d="M16.792 3.904A4.989 4.989 0 0 1 21.5 9.122c0 3.072-2.652 5.859-5.197 8.43-1.03 1.04-2.11 2.03-3.23 2.95-.12.1-.28.1-.4 0-1.12-.92-2.2-1.91-3.23-2.95-2.545-2.571-5.197-5.358-5.197-8.43a4.989 4.989 0 0 1 4.708-5.218 4.21 4.21 0 0 1 3.675 1.941c.84 1.175.98 1.763 1.12 1.763s.28-.588 1.12-1.763a4.21 4.21 0 0 1 3.675-1.941z"
                            stroke="currentColor"
                            stroke-width="2"
                            stroke-linecap="round"
                            stroke-linejoin="round"/>
                    </svg>
                </button>

                <button class="ig-icon-btn"
                        aria-label="Mensajes y Chat">

                    <svg class="ig-icon"
                         viewBox="0 0 24 24"
                         fill="none"
                         xmlns="http://www.w3.org/2000/svg">

                        <line
                            x1="22"
                            y1="3"
                            x2="9.218"
                            y2="15.782"
                            stroke="currentColor"
                            stroke-width="2"
                            stroke-linejoin="round"/>

                        <polygon
                            points="11.698 20.334 22 3.001 2 3.001 9.218 10.219 11.698 20.334"
                            stroke="currentColor"
                            stroke-width="2"
                            stroke-linejoin="round"/>
                    </svg>
                </button>

            </div>
        </header>

        <!-- CONTENIDO PRINCIPAL -->
        <main id="mainContent">

            <section id="homePage" class="page-view active">
                <div id="storiesContainer"></div>
                <div id="feedContainer"></div>
            </section>

            <section id="explorePage"
                     class="page-view"
                     style="display:none;">

                <div id="exploreContainer"></div>
            </section>

            <section id="createPage"
                     class="page-view"
                     style="display:none;">

                <div id="createContainer"></div>
            </section>

            <section id="activityPage"
                     class="page-view"
                     style="display:none;">

                <div id="activityContainer"></div>
            </section>

            <section id="profilePage"
                     class="page-view"
                     style="display:none;">

                <div id="profilePageContainer"></div>
            </section>

        </main>

        <!-- NAVEGACION INFERIOR -->
        <nav class="bottom-nav">

            <!-- INICIO -->
            <button class="bottom-nav-item active"
                    data-tab="home"
                    aria-label="Inicio">

                <svg class="nav-svg-icon"
                     viewBox="0 0 24 24"
                     fill="none"
                     xmlns="http://www.w3.org/2000/svg">

                    <path
                        d="M9.005 16.545a2.997 2.997 0 0 1 2.997-2.997h0a2.997 2.997 0 0 1 2.997 2.997v3.454c0 .345.28.625.625.625H18.5a2 2 0 0 0 2-2V11.23a1 1 0 0 0-.37-.78l-7.5-6.08a1.05 1.05 0 0 0-1.26 0l-7.5 6.08a1 1 0 0 0-.37.78v7.389a2 2 0 0 0 2 2h3.278a.625.625 0 0 0 .625-.625V16.545Z"
                        stroke="currentColor"
                        stroke-width="2"
                        stroke-linejoin="round"/>
                </svg>
            </button>

            <!-- EXPLORAR -->
            <button class="bottom-nav-item"
                    data-tab="explore"
                    aria-label="Explorar">

                <svg class="nav-svg-icon"
                     viewBox="0 0 24 24"
                     fill="none"
                     xmlns="http://www.w3.org/2000/svg">

                    <path
                        d="M19 10.5A8.5 8.5 0 1 1 10.5 2a8.5 8.5 0 0 1 8.5 8.5Z"
                        stroke="currentColor"
                        stroke-width="2"/>

                    <line
                        x1="16.511"
                        y1="16.511"
                        x2="22"
                        y2="22"
                        stroke="currentColor"
                        stroke-width="2"
                        stroke-linecap="round"/>
                </svg>
            </button>

            <!-- CREAR -->
            <button class="bottom-nav-item"
                    data-tab="create"
                    aria-label="Crear publicación">

                <svg class="nav-svg-icon"
                     viewBox="0 0 24 24"
                     fill="none"
                     xmlns="http://www.w3.org/2000/svg">

                    <path
                        d="M2 12h20M12 2v20"
                        stroke="currentColor"
                        stroke-width="2"
                        stroke-linecap="round"/>
                </svg>
            </button>

            <!-- ACTIVIDAD -->
            <button class="bottom-nav-item"
                    data-tab="activity"
                    aria-label="Actividad">

                <svg class="nav-svg-icon"
                     viewBox="0 0 24 24"
                     fill="none"
                     xmlns="http://www.w3.org/2000/svg">

                    <path
                        d="M16.792 3.904A4.989 4.989 0 0 1 21.5 9.122c0 3.072-2.652 5.859-5.197 8.43-1.03 1.04-2.11 2.03-3.23 2.95-.12.1-.28.1-.4 0-1.12-.92-2.2-1.91-3.23-2.95-2.545-2.571-5.197-5.358-5.197-8.43a4.989 4.989 0 0 1 4.708-5.218 4.21 4.21 0 0 1 3.675 1.941c.84 1.175.98 1.763 1.12 1.763s.28-.588 1.12-1.763a4.21 4.21 0 0 1 3.675-1.941z"
                        stroke="currentColor"
                        stroke-width="2"/>
                </svg>
            </button>

            <!-- PERFIL -->
            <button class="bottom-nav-item"
                    data-tab="profile"
                    aria-label="Perfil">

                <svg class="nav-svg-icon"
                     viewBox="0 0 24 24"
                     fill="none"
                     xmlns="http://www.w3.org/2000/svg">

                    <path
                        d="M12 11.5a4.5 4.5 0 1 0 0-9 4.5 4.5 0 0 0 0 9Zm0 2c-4.418 0-8 2.239-8 5v1a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-1c0-2.761-3.582-5-8-5Z"
                        stroke="currentColor"
                        stroke-width="2"/>
                </svg>
            </button>

        </nav>

    </div>

    <!-- JAVASCRIPT ORIGINAL -->
    <script type="module" src="./js/main.js"></script>

</body>
</html>
